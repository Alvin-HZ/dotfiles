[audio]
enable_overdrive = true

[bar.default]
capsule = true
center = [ "group:g3", "workspaces-grouped", "workspaces", "clock", "battery", "power_profile", "weather" ]
end = [ "tray", "spacer_2", "group:g1", "group:g2", "group:g5" ]
margin_ends = 0
radius = 18
shadow = false
start = [ "group:g4", "active_window", "media" ]

    [[bar.default.capsule_group]]
    border = ""
    enabled = true
    fill = "surface_variant"
    id = "g1"
    members = [ "notifications", "clipboard", "network", "bluetooth" ]
    opacity = 1.0
    padding = 1.0

    [[bar.default.capsule_group]]
    enabled = true
    fill = "surface_variant"
    id = "g2"
    members = [ "volume", "brightness" ]
    opacity = 1.0
    padding = 6.0

    [[bar.default.capsule_group]]
    enabled = true
    fill = "surface_variant"
    id = "g3"
    members = [ "cpu", "ram" ]
    opacity = 1.0
    padding = 6.0

    [[bar.default.capsule_group]]
    enabled = true
    fill = "surface_variant"
    id = "g4"
    members = [ "launcher", "wallpaper", "theme_mode" ]
    opacity = 1.0
    padding = 6.0

    [[bar.default.capsule_group]]
    enabled = true
    fill = "surface_variant"
    id = "g5"
    members = [ "control-center", "session" ]
    opacity = 1.0
    padding = 6.0

[battery]
warning_threshold = 10

[desktop_widgets]
schema_version = 2
widget_order = [
    "desktop-widget-0000000000000001",
    "desktop-widget-0000000000000002",
    "desktop-widget-0000000000000003",
    "desktop-widget-0000000000000004"
]

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget.desktop-widget-0000000000000001]
    box_height = 0.0
    box_width = 0.0
    cx = 136.0
    cy = 114.5
    output = "DP-1"
    rotation = 0.0
    type = "clock"

        [desktop_widgets.widget.desktop-widget-0000000000000001.settings]
        background = false
        background_opacity = 0.80000000000000004
        center_text = true
        clock_style = "digital"
        format = "{:%H:%M}"
        shadow = false

    [desktop_widgets.widget.desktop-widget-0000000000000002]
    box_height = 48.0
    box_width = 128.0
    cx = 136.0
    cy = 157.0
    output = "DP-1"
    rotation = 0.0
    type = "clock"

        [desktop_widgets.widget.desktop-widget-0000000000000002.settings]
        background = false
        format = "{:%b %d, %Y}"

    [desktop_widgets.widget.desktop-widget-0000000000000003]
    box_height = 0.0
    box_width = 0.0
    cx = 1760.0
    cy = 141.0
    output = "DP-1"
    rotation = 0.0
    type = "weather"

        [desktop_widgets.widget.desktop-widget-0000000000000003.settings]
        background = false
        shadow = false
        show_forecast = true

    [desktop_widgets.widget.desktop-widget-0000000000000004]
    box_height = 0.0
    box_width = 0.0
    cx = 1741.0
    cy = 1112.0
    output = "DP-1"
    rotation = 0.0
    type = "media_player"

        [desktop_widgets.widget.desktop-widget-0000000000000004.settings]
        hide_when_no_media = true
        shadow = false

[idle]
behavior_order = [ "lock", "screen-off", "lock-and-suspend" ]

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 300.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = true
    timeout = 900.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 600.0

[location]
address = "Waterloo, Canada"

[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1", "lockscreen-widget-0000000000000001" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-1"]
    box_height = 150.0
    box_width = 810.0
    cx = 960.0
    cy = 763.0
    output = "DP-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-1".settings]
        background_color = "surface_variant"
        background_opacity = 1.0
        background_radius = 12.0
        center_password_text = true
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = false
        show_unlock_hint = false
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 150.0
    box_width = 810.0
    cx = 960.0
    cy = 927.0
    output = "eDP-1"
    placement_height = 1200.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = false
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000001]
    box_height = 0.0
    box_width = 0.0
    cx = 960.0
    cy = 412.5
    output = "eDP-1"
    placement_height = 1200.0
    placement_width = 1920.0
    rotation = 0.0
    type = "clock"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000001.settings]
        background = false
        center_text = true
        shadow = false

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000002]
    box_height = 64.0
    box_width = 256.0
    cx = 960.0
    cy = 408.0
    output = "DP-1"
    rotation = 0.0
    type = "clock"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000002.settings]
        background = false
        center_text = true
        format = "{:%a, %B %d, %Y}"
        shadow = false

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000004]
    box_height = 0.0
    box_width = 0.0
    cx = 1741.0
    cy = 1112.0
    output = "DP-1"
    rotation = 0.0
    type = "media_player"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000004.settings]
        background = true
        hide_when_no_media = true
        layout = "horizontal"
        shadow = false

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000005]
    box_height = 96.0
    box_width = 80.0
    cx = 1424.0
    cy = 763.0
    output = "DP-1"
    rotation = 0.0
    type = "yocraft/battery-widget:widget"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000005.settings]
        battery = "auto"
        battery_name = "BAT1"
        hide_full = false
        hide_plugged = false
        layout = "vertical"
        refresh_interval = 25
        show_glyph = true
        show_label = true

[osd.kinds]
media = false

[plugin_settings."user/hyprsunset-brightness"]
min_brightness = 0

[plugins]
auto_update = "all"
enabled = [ "user/hyprsunset-brightness", "alexander/screen-toolkit", "user/grouped-workspaces", "yocraft/battery-widget" ]

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/noctalia-dev/official-plugins"
    name = "official"

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/noctalia-dev/community-plugins"
    name = "community"

    [[plugins.source]]
    enabled = false
    kind = "path"
    location = "~/Coding/Noctalia-Plugins/"
    name = "grouped-workspaces"

    [[plugins.source]]
    kind = "path"
    location = "~/Projects/Noctalia-Plugins/"
    name = "Custom-Plugins"

[shell]
clipboard_auto_paste = "off"
polkit_agent = true

    [shell.animation]
    enabled = false

    [shell.launcher]
    categories = false
    compact = true

        [shell.launcher.providers.emoji]
        global = false

    [shell.panel]
    clipboard_placement = "attached"
    launcher_placement = "attached"

    [shell.screen_corners]
    enabled = true

    [shell.screenshot]
    confirm_region = true
    directory = "/home/alvin/Pictures/Screenshots"

    [[shell.session.actions]]
    action = "lock"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "1"
    variant = "default"

    [[shell.session.actions]]
    action = "logout"
    countdown_seconds = 0.0
    enabled = true
    variant = "default"

    [[shell.session.actions]]
    action = "lock_and_suspend"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "3"
    variant = "default"

    [[shell.session.actions]]
    action = "reboot"
    countdown_seconds = 0.0
    enabled = true
    variant = "default"

    [[shell.session.actions]]
    action = "shutdown"
    countdown_seconds = 0.0
    enabled = true
    variant = "destructive"

[system.monitor]
network_poll_seconds = 0

[theme]
builtin = "Gruvbox"
community_palette = "ADW"
mode = "auto"
source = "wallpaper"

    [theme.templates]
    builtin_ids = [ "btop", "gtk3", "gtk4", "kcolorscheme", "kitty", "qt" ]
    community_ids = [ "feishin", "zed" ]

        [theme.templates.user.terminal-sequences]
        input_path = "~/.config/noctalia/templates/terminal-sequences"
        output_path = "~/.cache/terminal-sequences"
        post_hook = "tee /dev/pts/[0-9]* < ~/.cache/terminal-sequences"

[wallpaper.default]
path = "/home/alvin/Pictures/Wallpapers/cloudy_crescent.png"

[wallpaper.last]
path = "/home/alvin/Pictures/Wallpapers/cloudy_crescent.png"

[wallpaper.monitors.DP-1]
path = "/home/alvin/Pictures/Wallpapers/landscape-nature.jpg"

[wallpaper.monitors.eDP-1]
path = "/home/alvin/Pictures/Wallpapers/cloudy_crescent.png"

[[wallpaper.favorite]]
palette_source = "wallpaper"
path = "/home/alvin/Pictures/Wallpapers/landscape-nature.jpg"
theme_mode = "auto"
wallpaper_scheme = "m3-content"

[[wallpaper.favorite]]
path = "/home/alvin/Pictures/Wallpapers/cloudy_crescent.png"
theme_mode = "auto"

[widget.active_window]
capsule = true
max_length = 160
min_length = 160
title_scroll = "on_hover"

[widget.battery]
capsule = true

[widget.brightness]
enabled = false

[widget.clock]
capsule = true
format = "{:%a, %m/%d} {:%H:%M}"

[widget.launcher]
capsule = true

[widget.media]
capsule = true
hide_when_no_media = true
title_scroll = "on_hover"

[widget.network]
show_label = false

[widget.power_profile]
capsule = true

[widget.spacer_2]
length = 25
type = "spacer"

[widget.taskbar]
group_by_workspace = true
group_single_icon_per_app = true

[widget.tray]
capsule = true

[widget.wallpaper]
capsule = true

[widget.weather]
capsule = true

[widget.workspaces]
active_pill_size = 1.5
anchor = true
capsule = true
empty_color = "surface"
enabled = false
occupied_color = "outline"

[widget.workspaces-grouped]
anchor = true
occupied_color = "on_secondary"
type = "user/grouped-workspaces:workspaces-grouped"
